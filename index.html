<style>
  html,body{height:100%;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
  .tab-content{display:none;animation:fadeIn 0.25s ease-out}
  .tab-content.active{display:block}

  input[type=range]{accent-color:#FD5108;width:100%;cursor:pointer}
  .card{background:#FFFFFF;border:1px solid #E2E8F0;border-radius:0.75rem;padding:1.25rem;box-shadow:0 1px 3px rgba(15,23,42,0.03);transition:box-shadow 0.2s ease, border-color 0.2s ease}
  .card:hover{box-shadow:0 4px 12px rgba(15,23,42,0.05)}
  .soft{background:#F1F5F9;border:1px solid #E2E8F0;border-radius:0.75rem;padding:1rem}
  .h3{font-size:13.5px;font-weight:700;color:#0F172A;margin-bottom:0.75rem;letter-spacing:-0.01em}
  .sub{font-size:11.5px;color:#64748B;font-weight:400}
  .lbl{font-size:11px;font-weight:600;color:#64748B;text-transform:uppercase;letter-spacing:0.04em}
  table td,table th{white-space:nowrap}
  tbody tr{transition:background .15s}tbody tr:hover,tbody tr.hl{background:#FFF4EE}
  tbody tr.hl td:first-child{box-shadow:inset 3px 0 0 #FD5108}
  .side{width:100%;display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px;font-size:10px;font-weight:600;color:#94A3B8;border-left:3px solid transparent;transition:all .2s}
  .side:hover{color:#fff;background:rgba(255,255,255,.05)}.side.active{color:#fff;background:rgba(253,81,8,.15);border-left-color:#FD5108}
  .side svg{width:20px;height:20px}
  .pill{padding:.35rem .9rem;border-radius:9999px;font-size:12px;font-weight:600;border:1px solid #CBD5E1;background:#fff;color:#334155;transition:all .15s;cursor:pointer}
  .pill:hover{border-color:#FD5108;transform:translateY(-1px)}.pill.on{background:#FFF4EE;color:#D94304;border-color:#FD5108}
  .seg{display:inline-flex;border:1px solid #CBD5E1;border-radius:9999px;overflow:hidden;background:#fff}
  .seg button{padding:.3rem 1rem;font-size:12px;font-weight:600;color:#475569;transition:all .15s}.seg button.on{background:#FFF4EE;color:#D94304}
  .tile{background:#fff;border:1px solid #E2E8F0;border-radius:.5rem;padding:.65rem .85rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem;width:100%;text-align:left;transition:all .15s}
  .tile .t{font-size:11.5px;color:#475569}.tile .v{font-size:14px;font-weight:700;color:#0F172A}
  .tile.link{cursor:pointer}.tile.link:hover{border-color:#FD5108;transform:translateY(-1px)}.tile.link .v{color:#D94304}.tile.warn .v{color:#DC2626}
  .heat{text-align:center;font-weight:600;transition:transform .15s}.heat:hover{transform:scale(1.06);position:relative;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .flow-el{transition:opacity .25s;cursor:pointer;animation:flowIn .6s ease backwards;animation-delay:var(--d,0s)}
  .flow-el.dim{opacity:.1}.flow-el:hover path{fill-opacity:.5}
  @keyframes flowIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
  #flow-tip{position:absolute;pointer-events:none;background:#0F172A;color:#fff;font-size:11px;padding:6px 10px;border-radius:8px;opacity:0;transition:opacity .15s;white-space:nowrap;z-index:5}
  .funnel-bar{transition:width .55s cubic-bezier(.22,1,.36,1), filter .2s}
  .funnel-row:hover .funnel-bar{filter:brightness(1.06)}
  .node{background:#fff;border:1px solid #CBD5E1;border-radius:.5rem;padding:.5rem .75rem;font-size:11px;text-align:left;width:100%;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:all .2s;animation:fadeIn .5s ease backwards;animation-delay:var(--d,0s)}
  button.node{cursor:pointer}button.node:hover{border-color:#FD5108;transform:translateY(-2px);box-shadow:0 6px 14px rgba(15,23,42,.08)}
  .node b{font-size:12px;color:#0F172A}.node.flag{border-color:#F97316;background:#FFF7ED}.node.sel{border:2px solid #FD5108;background:#FFEDD5}.node.root{background:#FFF7ED;border-color:#FD5108;max-width:300px}
  .col{min-width:175px;flex:1}
  ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}

<body class="bg-mckBg text-slate-900 antialiased flex flex-col overflow-x-hidden">

<header class="bg-[#111827] text-white h-14 px-5 flex items-center justify-between shrink-0 border-b border-slate-800">

<div class="flex flex-1 min-h-0 overflow-hidden">

<div id="msg-modal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center z-50 p-4">

<script>
const C={o:'#FD5108',o2:'#FE7C39',o3:'#FFAA72',d:'#1E293B',g:'#94A3B8',r:'#EF4444',gr:'#10B981',am:'#F59E0B',blue:'#3B82F6'};
const COMP={base:C.d,allow:C.o,bonus:C.o3,ben:C.blue};
const S={grades:[],benchmarks:[],emps:[],pop:'All',excludeOutliers:false,manual:new Set(),collapsed:new Set(),node:null,pStruct:50,pBench:50,pGrade:50,sel:0,tab:'dash',dm:'cost',chip:'All',estMarket:false,derivedBands:false,report:null,flowScope:'All',funnelGrade:'All',mixMode:'amt',oFilter:'flag',fresh:true,
  tb:{pct:50,bw:50,gap:20,allowPct:100,benPct:100,bonusDelta:0,onCost:12,attrRed:3,repl:50,phase:1}};
const PRESETS={'Conservative':{pct:40,bw:50,gap:0,allowPct:90,benPct:90,bonusDelta:0},'Market-aligned':{pct:50,bw:50,gap:20,allowPct:100,benPct:100,bonusDelta:0},'Competitive':{pct:60,bw:60,gap:30,allowPct:105,benPct:105,bonusDelta:2}};
let G=[],E=[],RAW_E=[],K={},charts={};
const MODS=[['dash','Dashboard','M4 5a1 1 0 011-1h5v7H4V5zm10-1h5a1 1 0 011 1v3h-6V4zM4 13h6v7H5a1 1 0 01-1-1v-6zm10-3h6v9a1 1 0 01-1 1h-5V10z'],
 ['struct','Pay structure','M4 20V10m6 10V4m6 16v-7m4 7H2'],
 ['rewards','Total rewards','M12 8c-3 0-6-1-6-2.5S9 3 12 3s6 1 6 2.5S15 8 12 8zM6 5.5v4C6 11 9 12 12 12s6-1 6-2.5v-4M6 9.5v4C6 15 9 16 12 16s6-1 6-2.5v-4M6 13.5v4C6 19 9 20 12 20s6-1 6-2.5v-4'],
 ['work','Workspace','M12 3v4m0 0H5v4m7-4h7v4M3 11h4v4H3zm14 0h4v4h-4zM10 3h4v4h-4z'],
 ['grade','Grade outliers','M12 3l9 5-9 5-9-5 9-5zM3 12l9 5 9-5M3 16l9 5 9-5'],
 ['bench','Benchmark','M3 17l6-6 4 4 8-8M15 7h6v6'],
 ['tobe','To-be design','M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M14 4v4M8 10v4M16 16v4'],
 ['impact','Financial impact','M12 3v18m4-14h-5a3 3 0 000 6h2a3 3 0 010 6H8']];
const TITLES={dash:'Executive Dashboard',struct:'Pay Structure & Grade Ladder',rewards:'Total Rewards, Cost Flow & Demographics',work:'Workspace: Organisation Tree',grade:'Grade Outliers & Drill-Down',bench:'Market Benchmarking',tobe:'To-Be Pay Structure',impact:'Financial Impact'};

function showHTML(t,h){document.getElementById('msg-title').innerText=t;document.getElementById('msg-body').innerHTML=h;const m=document.getElementById('msg-modal');m.classList.remove('hidden');m.classList.add('flex')}
const showMsg=(t,b)=>showHTML(t,`<p>${esc(b)}</p>`);
function closeMsg(){const m=document.getElementById('msg-modal');m.classList.add('hidden');m.classList.remove('flex')}
const sum=a=>a.reduce((x,y)=>x+y,0),avg=a=>a.length?sum(a)/a.length:0;
const fmt=n=>(n==null||isNaN(n))?'-':Math.round(n).toLocaleString();
const fm=n=>{if(n==null||isNaN(n))return'-';const a=Math.abs(n);return(n<0?'-':'')+(a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e3?(a/1e3).toFixed(1)+'K':Math.round(a))};
const pc=(n,d=1)=>(n==null||isNaN(n))?'-':n.toFixed(d)+'%';
const sgn=(n,f=fm)=>(n>=0?'+':'')+f(n);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const q$=s=>esc(s).replace(/'/g,"\\'");
function quant(s,p){if(!s.length)return 0;const i=(s.length-1)*p/100,lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo)}
function corr(x,y){const n=x.length;if(n<4)return null;const mx=avg(x),my=avg(y);let a=0,b=0,c=0;for(let i=0;i<n;i++){a+=(x[i]-mx)*(y[i]-my);b+=(x[i]-mx)**2;c+=(y[i]-my)**2}return b&&c?a/Math.sqrt(b*c):null}
function mkt(g,p){const pts=[[25,g.p25],[50,g.p50],[75,g.p75],[90,g.p90]];let a=pts[0],b=pts[1];if(p>=50&&p<75){a=pts[1];b=pts[2]}else if(p>=75){a=pts[2];b=pts[3]}return Math.max(0,a[1]+(b[1]-a[1])*(p-a[0])/(b[0]-a[0]))}
function mktPct(g,v){let lo=1,hi=99;for(let i=0;i<30;i++){const m=(lo+hi)/2;mkt(g,m)<v?lo=m:hi=m}return(lo+hi)/2}
const rc=r=>r==null?['No data','bg-slate-100 text-slate-500','#e2e8f0']:r<95?['Lagging','bg-amber-100 text-amber-800','#fde68a']:r>105?['Leading','bg-rose-100 text-rose-800','#fecaca']:['Aligned','bg-emerald-100 text-emerald-800','#bbf7d0'];
const get=k=>k.split('.').reduce((o,p)=>o[p],S);const SL={};
function sl(key,label,min,max,step,pre='',suf=''){SL[key]={pre,suf};const v=get(key);return`<div><div class="flex justify-between items-center mb-1.5"><label class="text-xs font-semibold text-slate-700">${label}</label><span id="o-${key}" class="text-xs font-bold bg-pwcOrange text-white px-2.5 py-0.5 rounded-md">${pre}${v}${suf}</span></div><input id="i-${key}" type="range" min="${min}" max="${max}" step="${step}" value="${v}" oninput="setS('${key}',+this.value)"></div>`}
function syncOut(k){const v=get(k);const o=document.getElementById('o-'+k),i=document.getElementById('i-'+k);if(o)o.innerText=SL[k].pre+v+SL[k].suf;if(i)i.value=v}
function setS(k,v){const p=k.split('.'),l=p.pop();p.reduce((o,x)=>o[x],S)[l]=v;syncOut(k);renderAll()}
const cv=(id,title,h='h-72',span='',sub='')=>`<div class="card min-w-0 ${span}"><div class="h3">${title}${sub?` <span class="sub block">${sub}</span>`:''}</div><div class="w-full"><div class="relative w-full ${h}" id="w-${id}"><canvas id="${id}"></canvas></div></div></div>`;
const kpi=(l,v,s='',col='')=>`<div class="card lift"><span class="lbl">${l}</span><p class="kpi-v text-2xl font-extrabold mt-1.5 tracking-tight ${col||'text-slate-900'}">${v}</p>${s?`<p class="text-[11px] text-slate-500 mt-1">${s}</p>`:''}</div>`;
function table(id,heads,rows,rowAttr){const el=document.getElementById(id);if(!el)return;el.innerHTML=`<thead><tr class="bg-slate-50 text-slate-700 border-b border-slate-200 font-bold">${heads.map(h=>`<th class="p-2.5">${h}</th>`).join('')}</tr></thead><tbody class="divide-y divide-slate-100 text-slate-600">${rows.map((r,ri)=>`<tr ${rowAttr?rowAttr(ri):''}>${r.map((c,i)=>`<td class="p-2.5 ${i==0?'font-bold text-slate-900':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody>`}
const tw=(id,title,sub='',extra='')=>`<div class="card p-0 overflow-hidden min-w-0"><div class="px-5 py-3.5 border-b border-slate-100 flex flex-wrap justify-between items-center gap-2"><div class="h3 mb-0">${title} <span class="sub ml-1">${sub}</span></div>${extra}</div><div class="overflow-x-auto max-h-[440px]"><table class="w-full text-left text-xs" id="${id}"></table></div></div>`;
const ySc=(t,x={})=>({y:Object.assign({beginAtZero:true,grid:{color:'#F1F5F9'},title:{display:!!t,text:t,font:{size:11,weight:'600'}}},x),x:{grid:{display:false}}});
const stk=(t,x={})=>({x:{stacked:true,grid:{display:false}},y:Object.assign({stacked:true,beginAtZero:true,grid:{color:'#F1F5F9'},title:{display:!!t,text:t,font:{size:11,weight:'600'}}},x)});
const line=(label,data,color,x={})=>Object.assign({type:'line',label,data,borderColor:color,backgroundColor:color,tension:.25,pointRadius:4,pointHoverRadius:7,order:1},x);
const rangeBars=(a,color,label)=>({type:'bar',label,data:a,backgroundColor:color,borderRadius:4,order:2});

const ladderPlugin={id:'ladder',
  beforeDatasetsDraw(ch,_a,o){const{ctx,chartArea:ca,scales:{x,y}}=ch;if(!x||!y)return;const act=ch.tooltip&&ch.tooltip.getActiveElements&&ch.tooltip.getActiveElements()[0];
    if(act&&x.ticks.length>1){const w=Math.abs(x.getPixelForValue(1)-x.getPixelForValue(0));ctx.save();ctx.fillStyle='rgba(15,23,42,.05)';ctx.fillRect(x.getPixelForValue(act.index)-w/2,ca.top,w,ca.bottom-ca.top);ctx.restore()}
    if(!o||!o.g)return;const g=o.g;ctx.save();
    for(let i=0;i<g.length-1;i++){const n=g[i+1];if(g[i].max<=n.min)continue;const x0=x.getPixelForValue(i),x1=x.getPixelForValue(i+1),yt=y.getPixelForValue(g[i].max),yb=y.getPixelForValue(n.min);
      const hot=act&&(act.index===i||act.index===i+1);ctx.fillStyle=hot?'rgba(253,81,8,.38)':'rgba(253,81,8,.16)';ctx.strokeStyle='rgba(253,81,8,.85)';ctx.setLineDash([4,3]);ctx.lineWidth=hot?1.6:1;ctx.fillRect(x0,yt,x1-x0,yb-yt);ctx.strokeRect(x0,yt,x1-x0,yb-yt)}
    ctx.restore()},
  afterDatasetsDraw(ch,_a,o){if(!o||!o.g||o.g.length>14)return;const{ctx,scales:{x,y}}=ch,g=o.g;ctx.save();ctx.font='600 10px Inter';ctx.textAlign='center';
    for(let i=0;i<g.length-1;i++){if(g[i+1].prog==null)continue;const x0=x.getPixelForValue(i),x1=x.getPixelForValue(i+1),ym=(y.getPixelForValue(g[i].mid)+y.getPixelForValue(g[i+1].mid))/2;
      const t='+'+g[i+1].prog.toFixed(0)+'%';const w=ctx.measureText(t).width+8;ctx.fillStyle='#1E293B';ctx.beginPath();ctx.roundRect((x0+x1)/2-w/2,ym-17,w,15,4);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(t,(x0+x1)/2,ym-6)}
    ctx.restore()}};
Chart.register(ladderPlugin);
function chart(id,cfg,opt={}){
  const el=document.getElementById(id);if(!el)return;
  cfg.type=cfg.type||'bar';
  const base={responsive:true,maintainAspectRatio:false,animation:{duration:650,easing:'easeOutCubic',delay:c=>c.type==='data'&&c.mode==='default'?Math.min(c.dataIndex*28,420):0},interaction:{mode:'index',intersect:false},
    onHover:(e,a)=>{if(e.native&&e.native.target)e.native.target.style.cursor=opt.drill&&a.length?'pointer':'default';if(opt.hover)opt.hover(a)},
    onClick:opt.drill?(e,a,ch)=>{const p=ch.getElementsAtEventForMode(e,'index',{intersect:false},true);if(p.length){S.sel=p[0].index;switchTab('grade')}}:undefined,
    plugins:{legend:{position:'bottom',labels:{boxWidth:12,padding:12,usePointStyle:true,font:{size:11}}},tooltip:{backgroundColor:'#0F172A',padding:10,cornerRadius:8,boxPadding:4}}};
  const o=cfg.options||{};cfg.options=Object.assign({},base,o,{plugins:Object.assign({},base.plugins,o.plugins||{})});
  if(charts[id]&&!S.fresh&&charts[id].config.type===cfg.type){const c=charts[id];c.data=cfg.data;c.options=cfg.options;c.update();return}
  if(charts[id])charts[id].destroy();charts[id]=new Chart(el,cfg);
}
function countUp(){document.querySelectorAll('#shell .kpi-v').forEach(el=>{const t=el.textContent,m=t.match(/^([^0-9\-]*)(-?[\d,]*\.?\d+)(.*)$/);if(!m)return;const dec=(m[2].split('.')[1]||'').length,end=parseFloat(m[2].replace(/,/g,''));if(isNaN(end))return;const t0=performance.now();const step=now=>{const k=Math.min(1,(now-t0)/750),e=1-Math.pow(1-k,3);el.textContent=m[1]+(end*e).toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec})+m[3];if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}

/* ================= GRADE NAME HELPERS ================= */
const nk=s=>String(s??'').toLowerCase().replace(/[^a-z0-9]/g,'');

function scoreAlias(h,a){if(h===a)return 1000+a.length;if(a.length<=2)return 0;if(a.length===3)return((/^p\d\d$/.test(a)||a==='min'||a==='max')&&(h.startsWith(a)||h.endsWith(a)))?3:0;if(a.length===4)return(h.startsWith(a)||h.endsWith(a))?4:0;return h.includes(a)?a.length:0}
function mapHeaders(headers,SCH,GEN){const out=[];headers.forEach((raw,i)=>{const n=cleanH(raw);if(!n||IGN.test(n))return;let bf=null,bs=0;
  for(const f in SCH)for(const a of SCH[f]){let s=scoreAlias(n,a);if(s&&s<1000&&!GEN.includes(f))s+=20;if(s>bs){bs=s;bf=f}}
  if(bf){const r=String(raw).toLowerCase();if(bf==='bonus'&&/%|pct|percent|target|rate/.test(r))bf='bpct';out.push({i,f:bf,s:bs,h:String(raw).trim(),mon:/month|mthly|permonth|\bpm\b/.test(r)?12:1})}});return out}
function readSheet(ws){const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:false});if(!aoa||aoa.length<2)return null;
  const U=Object.assign({},SCH_E,SCH_G);let hr=0,bc=-1;
  for(let r=0;r<Math.min(25,aoa.length);r++){const c=aoa[r].filter(x=>typeof x==='string'&&x.trim()&&mapHeaders([x],U,[]).length).length;if(c>bc){bc=c;hr=r}}
  return{headers:aoa[hr].map(x=>String(x).trim()),rows:aoa.slice(hr+1).filter(r=>r.some(c=>c!==''&&c!=null)&&!/^(grand )?total/i.test(String(r[0]).trim()))}}
function toNum(v){if(typeof v==='number')return isFinite(v)?v:undefined;if(v==null)return;let s=String(v).trim().replace(/[,\s]/g,'');if(!s||s==='-')return;const m=s.match(/-?\d+(\.\d+)?/);if(!m)return;let n=parseFloat(m[0]);if(/^\(.*\)$/.test(s))n=-Math.abs(n);if(/\dk$/i.test(s))n*=1e3;else if(/\dm$/i.test(s))n*=1e6;return n}
const best=(M,f)=>M.filter(x=>x.f===f).sort((a,b)=>b.s-a.s)[0];

function detectGradeColFallback(headers,rows){
  let bestIdx=-1,bestScore=0;
  headers.forEach((h,i)=>{
    const clean=cleanH(h);
    if(!clean||/(id|name|emp|salary|base|pay|bonus|allow|ben|age|ten|gender|sex|fn|func|dept|role|title|desig)/.test(clean))return;
    const vals=rows.map(r=>String(r[i]??'').trim()).filter(Boolean);
    if(!vals.length)return;
    const uniq=new Set(vals);
    const codeLike=vals.filter(v=>v.length<=20&&/\d/.test(v)&&!/^\d+(\.\d+)?$/.test(v)).length/vals.length;
    if(uniq.size>=2&&uniq.size<=Math.max(40,vals.length*0.6)&&codeLike>bestScore){bestScore=codeLike;bestIdx=i}
  });
  return bestScore>=0.45?{i:bestIdx,f:'grade',s:50,h:headers[bestIdx]||'Grade'}:null;
}

function parseWorkbook(wb,fname){
  const rep={file:fname,sheets:[],map:[],warn:[],miss:[]};
  const sh=wb.SheetNames.map(n=>{const d=readSheet(wb.Sheets[n]);if(!d)return null;const eM=mapHeaders(d.headers,SCH_E,GEN_E),gM=mapHeaders(d.headers,SCH_G,GEN_G);
    if(!has(eM,'grade')){const fb=detectGradeColFallback(d.headers,d.rows);if(fb)eM.push(fb)}
    if(!has(gM,'grade')){const fb=detectGradeColFallback(d.headers,d.rows);if(fb)gM.push(fb)}
    const isBenchName=/bench|market|survey|mkt|bm/i.test(n);
    const hasBenchCol=has(gM,'bg')&&!has(gM,'grade');
    const isBenchOnly=(isBenchName||hasBenchCol)&&has(gM,'p50')&&!has(eM,'base');
    return{n,d,eM,gM,isBenchOnly,
      eS:has(eM,'base')&&has(eM,'grade')?10+Math.min(d.rows.length,1e4)/1e4:has(eM,'base')?3:0,
      gS:isBenchOnly?0:(has(gM,'min')&&has(gM,'max')?10:(has(gM,'min')||has(gM,'max'))&&has(gM,'mid')?9:0),
      mS:has(gM,'p50')?(isBenchOnly?15:5):0}}).filter(Boolean);
  if(!sh.length)throw new Error('The file has no readable sheets.');
  const emp=sh.filter(s=>s.eS>=10&&s.d.rows.length>=2).sort((a,b)=>b.eS-a.eS)[0]||null;
  const gsh=sh.filter(s=>s!==emp&&!s.isBenchOnly&&s.gS>=9).sort((a,b)=>b.gS-a.gS)[0]||null;
  const bsh=sh.filter(s=>s!==emp&&s!==gsh&&s.mS>0).sort((a,b)=>b.mS-a.mS)[0]||null;
  if(!emp&&!gsh)throw new Error('Could not find client data (needs an Employee sheet with Grade & Base Salary, or a Client Grades sheet with Grade, Min & Max). If this file is a market survey, use the "Import Benchmark" button.');
      let mb=v('mb');if(mb!=null&&mb<=1)mb*=100;const bc=best(M,'bg');
function parseBenchmarkWorkbook(wb,fname){
  const sh=wb.SheetNames.map(n=>{const d=readSheet(wb.Sheets[n]);if(!d)return null;const gM=mapHeaders(d.headers,SCH_G,GEN_G);
    if(!has(gM,'grade')&&!has(gM,'bg')){const fb=detectGradeColFallback(d.headers,d.rows);if(fb)gM.push(fb)}
    const score=(has(gM,'p50')?10:0)+(has(gM,'p25')?2:0)+(has(gM,'p75')?2:0)+(has(gM,'min')?1:0)+(/bench|market|survey|bm/i.test(n)?3:0);
    return{n,d,gM,score}}).filter(Boolean).sort((a,b)=>b.score-a.score);
  const s=sh[0];
  if(!s||s.score<5)throw new Error('Could not find a market benchmark table. Make sure the sheet has a Benchmark Grade/Level column and at least Market P50 (or Midpoint/P25/P75).');
  const M=s.gM,lc=best(M,'bg')||best(M,'grade')||{i:0};
  const benchmarks=s.d.rows.map((r,idx)=>{
    const label=r[lc.i];if(label===''||label==null)return null;
    const v=f=>{const c=best(M,f);return c?toNum(r[c.i])*(c.mon||1):undefined};
    const p50=v('p50')??v('mid')??((v('min')!=null&&v('max')!=null)?(v('min')+v('max'))/2:undefined);
    if(p50==null||isNaN(p50)||p50<=0)return null;
    let mb=v('mb');if(mb!=null&&mb<=1)mb*=100;
    return{bGrade:String(label).trim(),p25:v('p25')??v('min')??p50*.88,p50,p75:v('p75')??v('max')??p50*1.12,p90:v('p90')??p50*1.25,mAllow:v('ma')??p50*.1,mBonus:mb??10,mBen:v('me')??p50*.12};
  }).filter(Boolean).sort((a,b)=>a.p50-b.p50);
  if(!benchmarks.length)throw new Error('No valid benchmark rows with numeric P50/Midpoint values were found.');
  return{benchmarks,sheetName:s.n};
}

function relinkGradesToBenchmarks(){
  if(!S.benchmarks.length)return;
  S.grades.forEach(g=>{
    const mid=(g.min+g.max)/2;
    let b=g.bGrade?S.benchmarks.find(x=>gk(x.bGrade)===gk(g.bGrade)):null;
    if(!b)b=S.benchmarks.find(x=>gk(x.bGrade)===gk(g.grade));
    if(!b)b=S.benchmarks.reduce((a,c)=>Math.abs(c.p50-mid)<Math.abs(a.p50-mid)?c:a,S.benchmarks[0]);
    g.bGrade=b?b.bGrade:'';
  });
}

function resolveBenchmark(g,mid){const B=S.benchmarks;

function derive(){
  const pool=S.emps.filter(e=>S.pop==='All'||e.fn===S.pop);
  RAW_E=pool;
  G=S.grades.slice().sort((a,b)=>((a.min+a.max)-(b.min+b.max))||natGrade(a.grade,b.grade)).map(g=>{const mid=(g.min+g.max)/2,b=resolveBenchmark(g,mid);return{...g,mid,bGrade:b.bGrade,p25:b.p25,p50:b.p50,p75:b.p75,p90:b.p90,mAllow:b.mAllow,mBonus:b.mBonus,mBen:b.mBen}});
  const gm={};G.forEach(g=>gm[g.grade]=g);
  G.forEach((g,i)=>{const n=G[i+1],p=G[i-1];g.bw=(g.max-g.min)/g.min*100;g.prog=p?(g.mid-p.mid)/p.mid*100:null;g.diff=p?g.mid-p.mid:null;g.ovlPrev=p?Math.max(0,(p.max-g.min)/(p.max-p.min)*100):null;g.ovl=n?Math.max(0,(g.max-n.min)/(g.max-g.min)*100):null});
  E=pool.filter(e=>{if(S.manual.has(e.id))return false;if(S.excludeOutliers){const g=gm[e.grade];return g&&e.base>=g.min&&e.base<=g.max}return true});
  G.forEach(g=>{g.rawE=pool.filter(e=>e.grade===g.grade);g.e=E.filter(e=>e.grade===g.grade);g.hc=g.e.length;g.sal=g.e.map(e=>e.base).sort((a,b)=>a-b);const av=f=>avg(g.e.map(f));
    g.avg=av(e=>e.base);g.aAllow=av(e=>e.allow);g.aBonus=av(e=>e.bonus);g.aBen=av(e=>e.ben);g.aTcc=av(e=>e.tcc);g.aHous=av(e=>e.hous);g.aTrans=av(e=>e.trans);g.aOth=av(e=>e.oth);g.aMed=av(e=>e.med);g.aRet=av(e=>e.ret);g.aIns=av(e=>e.ins);g.aObn=av(e=>e.obn);
    g.compa=g.hc?g.avg/g.mid*100:null;g.pen=g.hc?avg(g.e.map(e=>(e.base-g.min)/(g.max-g.min)*100)):null;
    g.below=g.rawE.filter(e=>e.base<g.min).length;g.above=g.rawE.filter(e=>e.base>g.max).length;
    g.bPct=g.hc?av(e=>e.bpct)*100:null;const tg=sum(g.e.map(e=>e.base*e.bpct));g.payout=tg?sum(g.e.map(e=>e.bonus))/tg*100:null;g.mTcc=g.p50+g.mAllow+g.p50*g.mBonus/100+g.mBen;
    const f=g.e.filter(e=>e.gender==='F').map(e=>e.base),m=g.e.filter(e=>e.gender==='M').map(e=>e.base);g.gap=f.length&&m.length?(avg(m)-avg(f))/avg(m)*100:null;g.mp=g.hc?mktPct(g,g.avg):null;
    g.fPct=g.hc?g.e.filter(e=>e.gender==='F').length/g.hc*100:0;g.mPct=g.hc?g.e.filter(e=>e.gender==='M').length/g.hc*100:0;
    const ag=g.e.map(e=>e.age).filter(x=>x!=null&&!isNaN(x)),tn=g.e.map(e=>e.ten).filter(x=>x!=null&&!isNaN(x));g.avgAge=ag.length?avg(ag):null;g.avgTen=tn.length?avg(tn):null});
  const t=f=>sum(E.map(f)),hc=E.length;
  K={hc,rawHc:pool.length,base:t(e=>e.base),allow:t(e=>e.allow),bonus:t(e=>e.bonus),ben:t(e=>e.ben),tcc:t(e=>e.tcc)};
  K.avgBase=hc?K.base/hc:0;K.avgTcc=hc?K.tcc/hc:0;K.medTcc=quant(E.map(e=>e.tcc).sort((a,b)=>a-b),50);K.out=sum(G.map(g=>g.below+g.above));
  const tg=sum(E.map(e=>e.base*e.bpct));K.payout=tg?K.bonus/tg*100:null;
  const w=G.filter(g=>g.gap!=null);K.gap=w.length?sum(w.map(g=>g.gap*g.hc))/sum(w.map(g=>g.hc)):null;
  K.baseVs=hc?sum(G.map(g=>g.avg*g.hc))/sum(G.map(g=>g.p50*g.hc))*100:null;K.tccVs=hc?sum(G.map(g=>g.aTcc*g.hc))/sum(G.map(g=>g.mTcc*g.hc))*100:null;
  const cr=(a,b)=>hc?sum(G.map(g=>g[a]*g.hc))/sum(G.map(g=>g[b]*g.hc))*100:null;K.allowVs=cr('aAllow','mAllow');K.benVs=cr('aBen','mBen');
  K.bonusVs=hc?sum(G.map(g=>(g.bPct||0)*g.hc))/sum(G.map(g=>g.mBonus*g.hc))*100:null;
  const A=E.map(e=>e.age).filter(x=>x!=null&&!isNaN(x)),Tn=E.map(e=>e.ten).filter(x=>x!=null&&!isNaN(x));K.age=A.length?avg(A):null;K.ten=Tn.length?avg(Tn):null;K.fPct=hc?E.filter(e=>e.gender==='F').length/hc*100:0;
}
function toBe(over){
  const p=Object.assign({},S.tb,over);let any=0;
  const T=G.map(g=>{const mid=mkt(g,p.pct),min=mid*2/(2+p.bw/100),max=min*(1+p.bw/100);const aT=g.mAllow*p.allowPct/100,bT=g.mBen*p.benPct/100,tp=Math.max(0,(g.mBonus+p.bonusDelta)/100),po=(g.payout==null?100:g.payout)/100;
    const t={g,mid,min,max,nb:0,na:0,cB:0,cA:0,cBo:0,cBe:0,nB:0,nA:0,nBo:0,nBe:0};
    g.e.forEach(e=>{let b=e.base;if(b<min)b=min;if(b<mid)b+=(mid-b)*p.gap/100;if(b>max&&e.base<=max)b=max;
      const dB=b-e.base,dA=Math.max(0,aT-e.allow),dBo=Math.max(0,b*tp*po-e.bonus),dBe=Math.max(0,bT-e.ben);if(e.base<min)t.nb++;if(e.base>max)t.na++;
      t.cB+=dB;t.cA+=dA;t.cBo+=dBo;t.cBe+=dBe;if(dB>.5)t.nB++;if(dA>.5)t.nA++;if(dBo>.5)t.nBo++;if(dBe>.5)t.nBe++;if(dB+dA+dBo+dBe>.5)any++});
    t.cOn=p.onCost/100*(t.cB+t.cA+t.cBo);t.asTcc=sum(g.e.map(e=>e.tcc));t.asCtc=t.asTcc+p.onCost/100*sum(g.e.map(e=>e.base+e.allow+e.bonus));
    t.inc=t.cB+t.cA+t.cBo+t.cBe;t.toTcc=t.asTcc+t.inc;t.toCtc=t.asCtc+t.inc+t.cOn;return t});
  T.forEach((t,i)=>{const n=T[i+1];t.ovl=n?Math.max(0,(t.max-n.min)/(t.max-t.min)*100):null;t.prog=i?(t.mid/T[i-1].mid-1)*100:null});
  const s=f=>sum(T.map(f));
  const tot={cB:s(t=>t.cB),cA:s(t=>t.cA),cBo:s(t=>t.cBo),cBe:s(t=>t.cBe),cOn:s(t=>t.cOn),nB:s(t=>t.nB),nA:s(t=>t.nA),nBo:s(t=>t.nBo),nBe:s(t=>t.nBe),asTcc:s(t=>t.asTcc),asCtc:s(t=>t.asCtc),toCtc:s(t=>t.toCtc),aff:any,nb:s(t=>t.nb),na:s(t=>t.na)};
  tot.inc=tot.cB+tot.cA+tot.cBo+tot.cBe;tot.incCtc=tot.inc+tot.cOn;tot.toTcc=tot.asTcc+tot.inc;tot.save=K.hc*p.attrRed/100*p.repl/100*K.avgBase;return{T,tot,p};
}

  document.getElementById('gd-empty').classList.toggle('hidden',g.hc>0);document.getElementById('gd-body').classList.toggle('hidden',!g.hc);if(!g.hc)return;
  const p25=quant(g.sal,25),p75=quant(g.sal,75);
  document.getElementById('gd-cards').innerHTML=kpi('Employees',g.hc,S.excludeOutliers?`of ${g.rawE.length}`:'in grade')+kpi('Average base',fm(g.avg),'midpoint '+fm(g.mid))+kpi('Compa-ratio',pc(g.compa),'range penetration '+pc(g.pen,0),'text-pwcOrange')+kpi('Pay percentiles',`${fm(p25)} / ${fm(quant(g.sal,50))} / ${fm(p75)}`,'actual P25 / P50 / P75')+kpi('Outside band',`${g.below} / ${g.above}`,'below / above','text-rose-600');
  const roles={};g.e.forEach(e=>(roles[e.role]=roles[e.role]||[]).push(e));const names=Object.keys(roles).sort((a,b)=>avg(roles[a].map(e=>e.base))-avg(roles[b].map(e=>e.base)));
  const pts=[];names.forEach((n,i)=>roles[n].forEach((e,j)=>pts.push({x:i+((j*37%21)-10)/45,y:e.base,id:e.id,role:e.role,vs:(e.base/g.avg-1)*100})));const hl=y=>[{x:-.5,y},{x:names.length-.5,y}];
  chart('c-gd-scatter',{type:'scatter',data:{datasets:[{label:'Employees',data:pts,backgroundColor:pts.map(q=>q.y<g.min||q.y>g.max?C.r:q.y<p25||q.y>p75?C.am:C.o),pointRadius:6,pointHoverRadius:10,order:5},
    line('Band max',hl(g.max),C.r,{borderDash:[6,4],pointRadius:0}),line('Midpoint',hl(g.mid),C.d,{pointRadius:0,borderWidth:2}),line('Average pay',hl(g.avg),C.blue,{pointRadius:0,borderDash:[2,3]}),line('Band min',hl(g.min),C.r,{borderDash:[6,4],pointRadius:0}),line('Actual P25',hl(p25),C.g,{pointRadius:0,borderDash:[2,4],borderWidth:1}),line('Actual P75',hl(p75),C.g,{pointRadius:0,borderDash:[2,4],borderWidth:1})]},
    options:{interaction:{mode:'nearest',intersect:true},scales:{x:{min:-.5,max:names.length-.5,grid:{display:false},ticks:{stepSize:1,callback:v=>Number.isInteger(v)?names[v]:''}},y:{title:{display:true,text:'Base pay'},grid:{color:'#F1F5F9'},ticks:{callback:v=>fm(v)}}},
    plugins:{tooltip:{callbacks:{label:c=>c.raw.id?`${c.raw.id} (${c.raw.role}): ${fmt(c.raw.y)}  ${sgn(c.raw.vs,v=>v.toFixed(1)+'%')} vs avg`:`${c.dataset.label}: ${fmt(c.raw.y)}`}}}}});
  const flag=e=>e.base<g.min?['Below band','bg-rose-100 text-rose-700']:e.base>g.max?['Above band','bg-amber-100 text-amber-800']:e.base<p25?['Below P25','bg-sky-100 text-sky-700']:e.base>p75?['Above P75','bg-violet-100 text-violet-700']:['In range','text-slate-400'];
  const F={flag:['Flagged',e=>e.base<g.min||e.base>g.max||e.base<p25||e.base>p75],below:['Below band',e=>e.base<g.min],above:['Above band',e=>e.base>g.max],p25:['Below P25',e=>e.base<p25],p75:['Above P75',e=>e.base>p75],all:['All',e=>true]};
  document.getElementById('of-chips').innerHTML=Object.entries(F).map(([k,v])=>`<button class="pill ${S.oFilter===k?'on':''}" onclick="S.oFilter='${k}';S.fresh=false;renderAll()">${v[0]}</button>`).join('');
  const rows=g.e.filter(F[S.oFilter][1]).sort((a,b)=>Math.abs(b.base-g.avg)-Math.abs(a.base-g.avg)).slice(0,60);
  table('tb-emps',['Employee','Role','Department','Base pay','vs. grade avg','Compa-ratio','Position in band','Status',''],rows.map(e=>{const f=flag(e),v=(e.base/g.avg-1)*100;return[esc(e.id),esc(e.role),esc(e.fn),fmt(e.base),`<b class="${v>=0?'text-emerald-600':'text-amber-600'}">${sgn(v,x=>x.toFixed(1)+'%')}</b>`,pc(e.base/g.mid*100,0),pc((e.base-g.min)/(g.max-g.min)*100,0),`<span class="px-2 py-0.5 rounded text-[11px] font-bold ${f[1]}">${f[0]}</span>`,`<button class="text-[11px] font-bold text-slate-400 hover:text-rose-600" onclick="S.manual.add('${q$(e.id)}');S.fresh=false;renderAll()">Exclude</button>`]}));
  const rs=names.map(n=>{const es=roles[n],a=f=>avg(es.map(f));return[esc(n),es.length,fmt(a(e=>e.base)),fmt(a(e=>e.allow)),fmt(a(e=>e.bonus)),fmt(a(e=>e.ben)),`<b class="text-pwcOrange">${fmt(a(e=>e.tcc))}</b>`,`<b class="${a(e=>e.tcc)>=g.aTcc?'text-emerald-600':'text-amber-600'}">${sgn((a(e=>e.tcc)/g.aTcc-1)*100,x=>x.toFixed(1)+'%')}</b>`,pc(a(e=>e.base)/g.mid*100,0)]});
  table('tb-roles',['Role','Staff','Avg base','Allowances','Bonus','Benefits','Total rewards','vs. grade avg','Compa-ratio'],rs);
}

function updateGradeMapping(name,b){const g=S.grades.find(x=>x.grade===name);if(g){g.bGrade=b;S.fresh=false;renderAll()}}
function rBench(){
  const p=S.pBench,L=G.map(g=>g.grade),m=G.map(g=>mkt(g,p)),ratio=G.map((g,i)=>g.mid/m[i]*100),ov=avg(ratio);
  document.getElementById('bn-note').innerHTML=S.estMarket?'<span class="text-amber-600 font-semibold">Market values are estimated. Import a benchmark sheet for real results.</span>':`Comparing <b>${G.length} grades</b> against <b class="text-pwcOrange">${S.benchmarks.length} benchmark levels</b>`;
  document.getElementById('bn-map-panel').innerHTML=S.benchmarks.length?`<div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-2.5">${G.map(g=>`<div class="bg-slate-50 border border-slate-200 rounded-lg p-2"><div class="text-[11px] font-bold truncate">${esc(g.grade)}</div><select onchange="updateGradeMapping('${q$(g.grade)}',this.value)" class="mt-1 w-full text-[11px] border border-slate-300 rounded px-1.5 py-1 bg-white font-semibold text-pwcOrange">${S.benchmarks.map(b=>`<option value="${esc(b.bGrade)}" ${gk(b.bGrade)===gk(g.bGrade)?'selected':''}>${esc(b.bGrade)}</option>`).join('')}</select></div>`).join('')}</div>`:'<div class="sub">No benchmark levels to map.</div>';
  document.getElementById('bn-cards').innerHTML=kpi('Benchmark',`P${p} market`)+kpi('Midpoint competitiveness',pc(ov),rc(ov)[0],'text-pwcOrange')+kpi('Total rewards vs. P50',pc(K.tccVs),rc(K.tccVs)[0])+kpi('Aligned / lagging / leading',`${ratio.filter(r=>r>=95&&r<=105).length} / ${ratio.filter(r=>r<95).length} / ${ratio.filter(r=>r>105).length}`);
  const cells=g=>[g.hc?g.avg/g.p50*100:null,g.hc?g.aAllow/g.mAllow*100:null,g.hc?g.bPct/g.mBonus*100:null,g.hc?g.aBen/g.mBen*100:null,g.hc?g.aTcc/g.mTcc*100:null];
  document.getElementById('tb-bnheat').innerHTML=`<thead><tr><th class="p-2 text-left">Grade</th><th class="p-2 text-left">Benchmark</th>${['Base pay','Allowances','Bonus target','Benefits','Total rewards'].map(h=>`<th class="p-2 text-slate-500">${h}</th>`).join('')}</tr></thead><tbody>${G.map(g=>`<tr><th class="p-2 text-left">${esc(g.grade)}</th><td class="p-2 text-slate-500 font-semibold">${esc(g.bGrade)}</td>${cells(g).map(r=>`<td class="p-2 heat" style="background:${rc(r)[2]}">${r==null?'-':r.toFixed(0)+'%'}</td>`).join('')}</tr>`).join('')}</tbody>`;
  table('tb-bench',['Grade','Mapped Benchmark','Our Midpoint','Market P25','Market P50','Market P75','Market P90',`Market P${p}`,'Competitiveness','Avg Actual Base','Status'],G.map((g,i)=>{const[t,c]=rc(ratio[i]);return[esc(g.grade),`<span class="text-slate-500 font-semibold">${esc(g.bGrade)}</span>`,`<b class="text-pwcOrange">${fmt(g.mid)}</b>`,fmt(g.p25),fmt(g.p50),fmt(g.p75),fmt(g.p90),`<b>${fmt(m[i])}</b>`,`<b>${pc(ratio[i])}</b>`,g.hc?fmt(g.avg):'-',`<span class="px-2 py-0.5 rounded text-[11px] font-bold ${c}">${t}</span>`]}));
  chart('c-bn-range',{data:{labels:L,datasets:[{type:'bar',label:'Our band',data:G.map(g=>[g.min,g.max]),backgroundColor:C.d,borderRadius:4,barPercentage:.7},{type:'bar',label:'Market P25 to P90',data:G.map(g=>[g.p25,g.p90]),backgroundColor:C.o3,borderRadius:4,barPercentage:.7},line('Market P'+p,m,C.o),line('Avg actual base',G.map(g=>g.hc?g.avg:null),C.r,{borderDash:[4,3]})]},options:{scales:ySc('',{ticks:{callback:v=>fm(v)}})}},{drill:true});
  chart('c-bn-ratio',{data:{labels:L,datasets:[{type:'bar',label:'Competitiveness %',data:ratio,backgroundColor:ratio.map(r=>r<95?C.am:r>105?C.r:C.gr),borderRadius:5},line('95%',L.map(()=>95),C.g,{pointRadius:0,borderDash:[4,4]}),line('105%',L.map(()=>105),C.g,{pointRadius:0,borderDash:[4,4]})]},options:{scales:ySc('%',{beginAtZero:false,suggestedMin:80,suggestedMax:120})}},{drill:true});
}

function rToBe(){
  const X=toBe(),T=X.T,t=X.tot,L=G.map(g=>g.grade);
  document.getElementById('sc-pills').innerHTML=Object.keys(PRESETS).map(k=>`<button class="pill ${Object.entries(PRESETS[k]).every(([a,b])=>S.tb[a]===b)?'on':''}" onclick="applyPreset('${k}')">${k}</button>`).join('');
  document.getElementById('tb-cards').innerHTML=kpi('Incremental cost',fm(t.inc),pc(t.inc/t.asTcc*100,2)+' of total rewards','text-pwcOrange')+kpi('Incl. on-costs',fm(t.incCtc),pc(t.incCtc/t.asCtc*100,2)+' of CTC')+kpi('Employees affected',t.aff,pc(K.hc?t.aff/K.hc*100:0,0)+' of staff')+kpi('Below new min / above new max',`${t.nb} / ${t.na}`,'','text-rose-600');
  table('tb-tobe',['Grade','As-is mid','To-be mid','Change','To-be range','To-be overlap','Below new min','Above new max','Base cost','Allowances','Bonus','Benefits','Total'],T.map(r=>{const ch=(r.mid/r.g.mid-1)*100;return[esc(r.g.grade),fmt(r.g.mid),`<b class="text-pwcOrange">${fmt(r.mid)}</b>`,`<b class="${ch>=0?'text-emerald-600':'text-amber-600'}">${sgn(ch,x=>x.toFixed(1)+'%')}</b>`,`${fmt(r.min)} - ${fmt(r.max)}`,r.ovl==null?'-':pc(r.ovl,0),r.nb,r.na,fmt(r.cB),fmt(r.cA),fmt(r.cBo),fmt(r.cBe),`<b>${fmt(r.inc)}</b>`]}));
  chart('c-tb-range',{data:{labels:L,datasets:[{type:'bar',label:'As-is band',data:G.map(g=>[g.min,g.max]),backgroundColor:C.d,borderRadius:4,barPercentage:.7},{type:'bar',label:'To-be band',data:T.map(r=>[r.min,r.max]),backgroundColor:C.o,borderRadius:4,barPercentage:.7},line('To-be midpoint',T.map(r=>r.mid),C.o3)]},options:{scales:ySc('',{ticks:{callback:v=>fm(v)}}),plugins:{ladder:{g:T.map(r=>({min:r.min,max:r.max,mid:r.mid,prog:r.prog||0}))}}}});
  chart('c-tb-lev',{data:{labels:L,datasets:[['Base','cB'],['Allowances','cA'],['Bonus','cBo'],['Benefits','cBe']].map((x,i)=>({label:x[0],data:T.map(r=>r[x[1]]),backgroundColor:Object.values(COMP)[i],borderRadius:3}))},options:{scales:stk('',{ticks:{callback:v=>fm(v)}})}});
}
function applyPreset(k){Object.assign(S.tb,PRESETS[k]);Object.keys(PRESETS[k]).forEach(x=>syncOut('tb.'+x));S.fresh=false;renderAll()}

function rImpact(){
  const X=toBe(),T=X.T,t=X.tot,L=G.map(g=>g.grade),ph=S.tb.phase,net=t.incCtc-t.save,asAvg=K.hc?t.asCtc/K.hc:0,toAvg=K.hc?t.toCtc/K.hc:0;
  document.getElementById('im-cards').innerHTML=kpi('Avg CTC / employee, as-is',fm(asAvg))+kpi('Avg CTC / employee, to-be',fm(toAvg),sgn(toAvg-asAvg)+' ('+pc((toAvg/asAvg-1)*100,2)+')','text-pwcOrange')+kpi('Incremental annual cost',fm(t.incCtc),pc(t.incCtc/t.asCtc*100,2)+' of as-is CTC')+kpi('Per year when phased',fm(t.incCtc/ph),ph+' year'+(ph>1?'s':''))+
    kpi('Retention savings / year',fm(t.save),`${S.tb.attrRed} pts less attrition`,'text-emerald-600')+kpi('Net annual impact',fm(net),'cost less savings',net>0?'text-rose-600':'text-emerald-600')+kpi('Payback',t.save>0?(t.incCtc/t.save).toFixed(1)+' yrs':'-')+kpi('To-be CTC',fm(t.toCtc),'as-is '+fm(t.asCtc));
  table('tb-im',['Grade','Staff','As-is rewards','To-be rewards','Change','Change %','Avg CTC as-is','Avg CTC to-be','Change / employee'],[...T.map(r=>{const h=r.g.hc||1;return[esc(r.g.grade),r.g.hc,fmt(r.asTcc),fmt(r.toTcc),fmt(r.inc),pc(r.asTcc?r.inc/r.asTcc*100:0,2),fmt(r.asCtc/h),fmt(r.toCtc/h),`<b class="text-pwcOrange">${fmt((r.toCtc-r.asCtc)/h)}</b>`]}),['<b>Total</b>',K.hc,fmt(t.asTcc),fmt(t.toTcc),fmt(t.inc),pc(t.inc/t.asTcc*100,2),fmt(asAvg),fmt(toAvg),`<b class="text-pwcOrange">${fmt(toAvg-asAvg)}</b>`]]);
  chart('c-im-ctc',{data:{labels:L,datasets:[{label:'As-is',data:T.map(r=>r.g.hc?r.asCtc/r.g.hc:0),backgroundColor:C.d,borderRadius:4},{label:'To-be',data:T.map(r=>r.g.hc?r.toCtc/r.g.hc:0),backgroundColor:C.o,borderRadius:4}]},options:{scales:ySc('',{ticks:{callback:v=>fm(v)}})}},{drill:true});
  const v=[t.cB,t.cA,t.cBo,t.cBe,t.cOn];let run=t.asCtc;const fl=[[0,run]];v.forEach(x=>{fl.push([run,run+x]);run+=x});fl.push([0,run]);
  chart('c-im-wf',{data:{labels:['As-is','Base','Allow.','Bonus','Benefits','On-costs','To-be'],datasets:[{data:fl,backgroundColor:[C.d,C.o,C.o2,C.o3,C.blue,'#cbd5e1',C.d],borderRadius:5}]},options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fm(c.raw[1]-c.raw[0])}}},scales:{y:{min:Math.floor(t.asCtc*.9/1e5)*1e5,ticks:{callback:v=>fm(v)},grid:{color:'#F1F5F9'}},x:{grid:{display:false}}}}});
}

const R={dash:rDash,struct:rStruct,rewards:rRewards,work:rWork,grade:rGrade,bench:rBench,tobe:rToBe,impact:rImpact};
function renderAll(){
  derive();if(!G.length)return;
  document.getElementById('cleanse-dot').className='w-2 h-2 rounded-full '+(S.excludeOutliers?'bg-emerald-500':'bg-slate-300');
  document.getElementById('cleanse-lbl').innerText=S.excludeOutliers?`Outliers excluded (${K.rawHc-K.hc})`:'Include all staff';
  document.getElementById('pop-note').innerText=`${K.hc} of ${K.rawHc} employees`;
  const w=[];if(S.derivedBands)w.push('Some grade bands were derived from actual pay because no min/max was found. Outlier flags for those grades are not meaningful.');if(S.estMarket)w.push('No market data found. Market values are estimated from grade midpoints.');
  document.getElementById('warn-bar').innerHTML=w.length?`<div class="mb-4 bg-amber-50 border border-amber-200 text-amber-800 rounded-lg px-4 py-2.5 text-xs flex justify-between gap-3"><span>${w.join(' ')}</span><button class="font-bold underline shrink-0" onclick="showReport()">Details</button></div>`:'';
  R[S.tab]();
  if(S.fresh){S.fresh=false;countUp()}
}

/* ================= EXPORT / TEMPLATE ================= */
function downloadTemplate(){
  const d=sampleData(),wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.grades.map(g=>({Grade:g.grade,BenchmarkGrade:g.bGrade,Min:g.min,Max:g.max}))),'Grades');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.benchmarks.map(b=>({BenchmarkGrade:b.bGrade,MarketP25:b.p25,MarketP50:b.p50,MarketP75:b.p75,MarketP90:b.p90,MarketAllowancesP50:b.mAllow,MarketBonusTargetPct:b.mBonus,MarketBenefitsP50:b.mBen}))),'Benchmarks');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.emps.map(e=>({EmployeeID:e.id,Grade:e.grade,Role:e.role,Function:e.fn,Gender:e.gender,Age:e.age,TenureYears:e.ten,BaseSalary:e.base,HousingAllowance:e.hous,TransportAllowance:e.trans,OtherAllowance:e.oth,BonusTargetPct:e.bpct*100,BonusActual:e.bonus,Medical:e.med,Retirement:e.ret,Insurance:e.ins,OtherBenefits:e.obn}))),'Employees');
  XLSX.writeFile(wb,'rewards-framework-template.xlsx');
}
function exportResults(){
  const X=toBe(),wb=XLSX.utils.book_new(),r1=v=>v==null?'':+v.toFixed(1);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(G.map(g=>({Grade:g.grade,Benchmark:g.bGrade,Min:g.min,Midpoint:g.mid,Max:g.max,'Bandwidth %':r1(g.bw),'Midpoint progression %':r1(g.prog),'Midpoint differential':g.diff==null?'':Math.round(g.diff),'Overlap with previous %':r1(g.ovlPrev),P25:Math.round(g.min+(g.max-g.min)*.25),P50:Math.round(g.min+(g.max-g.min)*.5),P75:Math.round(g.min+(g.max-g.min)*.75),P90:Math.round(g.min+(g.max-g.min)*.9),Staff:g.hc,'Avg base':Math.round(g.avg),'Avg total rewards':Math.round(g.aTcc),'Compa-ratio %':r1(g.compa),'Market P50':Math.round(g.p50),'Below band':g.below,'Above band':g.above}))),'As-is diagnostic');
  const out=[];G.forEach(g=>g.rawE.forEach(e=>{if(e.base<g.min||e.base>g.max)out.push({Employee:e.id,Grade:g.grade,Role:e.role,'Base pay':e.base,Min:g.min,Max:g.max,Flag:e.base<g.min?'Below band':'Above band'})}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(out),'Outliers');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(X.T.map(t=>({Grade:t.g.grade,'To-be min':Math.round(t.min),'To-be mid':Math.round(t.mid),'To-be max':Math.round(t.max),'Base cost':Math.round(t.cB),'Allowance cost':Math.round(t.cA),'Bonus cost':Math.round(t.cBo),'Benefit cost':Math.round(t.cBe),'On-costs':Math.round(t.cOn),'Total incremental':Math.round(t.inc),'As-is CTC':Math.round(t.asCtc),'To-be CTC':Math.round(t.toCtc)}))),'To-be and impact');
  XLSX.writeFile(wb,'rewards-analysis.xlsx');
}

window.onload=()=>{Chart.defaults.font.size=11;Chart.defaults.font.family='Inter';Chart.defaults.color='#64748B';const d=sampleData();prep(d.emps);S.grades=d.grades;S.benchmarks=d.benchmarks;S.emps=d.emps;buildShell();setPopOptions();switchTab('dash')};
